name: Pre-market Research
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/radar-research.yml'
      - 'scripts/radar-nightly.bundle.mjs'
      - 'cloudflare/radar/migrations/**'
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        default: auto
        options: [auto, prepare, research, check]
  schedule:
    - cron: '17 11-17,19-23 * * *'
    - cron: '17 18 * * *'
    - cron: '27 19,20 * * 0-4'
    - cron: '17 21 * * 0-4'
permissions:
  contents: read
  id-token: write
  actions: read
concurrency:
  group: radar-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify research publisher authorization
        run: node scripts/radar-nightly.bundle.mjs
        env:
          RADAR_PHASE: check
          RADAR_WORKER_URL: https://holdings-radar-research-isolated.b28228223.workers.dev
      - uses: actions/cache/restore@v4
        id: cache
        with:
          path: radar-runtime
          key: radar-research-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: radar-research-v1-
      - name: Find durable checkpoint if cache is missing
        if: steps.cache.outputs.cache-matched-key == ''
        id: checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import {appendFileSync} from 'node:fs';
          const response=await fetch('https://api.github.com/repos/frankguo0922/stock/actions/artifacts?name=radar-checkpoint&per_page=1',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,Accept:'application/vnd.github+json'}});
          if(!response.ok)throw Error('CHECKPOINT_LOOKUP_FAILED');
          const artifact=(await response.json()).artifacts?.find(item=>!item.expired);
          if(artifact)appendFileSync(process.env.GITHUB_OUTPUT,'run-id='+artifact.workflow_run.id+'\n');
          NODE
      - uses: actions/download-artifact@v4
        if: steps.checkpoint.outputs.run-id != ''
        with:
          name: radar-checkpoint
          path: radar-runtime
          github-token: ${{ github.token }}
          run-id: ${{ steps.checkpoint.outputs.run-id }}
      - name: Restore compact checkpoint
        if: steps.checkpoint.outputs.run-id != ''
        run: |
          node --input-type=module -e "import{readFileSync,writeFileSync}from'node:fs';import{gunzipSync}from'node:zlib';writeFileSync('radar-runtime/checkpoint.sqlite',gunzipSync(readFileSync('radar-runtime/checkpoint.sqlite.gz'),{maxOutputLength:1000000000}));"
      - run: node scripts/radar-nightly.bundle.mjs
        env:
          RADAR_PHASE: ${{ github.event_name == 'push' && 'prepare' || inputs.phase || 'auto' }}
          RADAR_WORKER_URL: https://holdings-radar-research-isolated.b28228223.workers.dev
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: radar-runtime
          key: radar-research-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Compact daily recovery checkpoint
        if: always() && (github.event.schedule == '17 18 * * *' || inputs.phase == 'prepare')
        run: |
          node --input-type=module -e "import{existsSync,readFileSync,writeFileSync}from'node:fs';import{gzipSync}from'node:zlib';import{DatabaseSync}from'node:sqlite';const path='radar-runtime/checkpoint.sqlite';if(existsSync(path)){const db=new DatabaseSync(path);db.exec('PRAGMA wal_checkpoint(TRUNCATE)');db.close();writeFileSync(path+'.gz',gzipSync(readFileSync(path),{level:6}));}"
      - uses: actions/upload-artifact@v4
        if: always() && (github.event.schedule == '17 18 * * *' || inputs.phase == 'prepare')
        with:
          name: radar-checkpoint
          path: radar-runtime/checkpoint.sqlite.gz
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: radar-prepared-${{ github.run_id }}
          path: radar-runtime/prepared.json
          if-no-files-found: ignore
          retention-days: 7
