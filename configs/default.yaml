project:
  seed: 42
  output_dir: artifacts
data:
  prices_dir: data/prices
  default_source: local
  lookback_days_for_live: 365
  cache_min_refresh_seconds: 60
features:
  lookback: 20
forecast:
  train_ratio: 0.7
  val_ratio: 0.1
  model: lstm
  lstm_hidden: 128
  lstm_layers: 2
  lstm_epochs: 30
  lstm_lr: 0.001
  batch_size: 256
  shared: true
  shared_model: transformer
  horizons:
  - 21
  - 126
  - 252
  loss_weights:
    '21': 1.0
    '126': 0.7
    '252': 0.5
  shared_id: shared_v1
  transformer_d_model: 128
  transformer_nhead: 4
  transformer_layers: 2
  transformer_dropout: 0.1
  loss: huber
  huber_delta: 1.0
  lr_scheduler: reduce_on_plateau
  lr_patience: 5
  lr_factor: 0.5
  early_stopping_patience: 8
  walk_forward:
    enabled: true
    folds: 3
    train_ratio: 0.7
    val_ratio: 0.1

multimodal:
  enabled: false
  fundamentals_csv: data/fundamentals.csv
  news_sentiment_csv: data/news_sentiment.csv
  feature_prefix: mm_
